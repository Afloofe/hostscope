[package]
name = "hemostat-evfmt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The evidence record format: framing, the chain digest, and its verifier."

[dependencies]
# The workspace's first external dependency, and a deliberate one.
#
# The chain digest is SHA-256 (design §8.2.5). Hand-rolling it would be ~200
# lines of fiddly code duplicating a widely reviewed implementation, in the one
# component whose correctness an examiner may have to rely on years from now.
#
# `sha2` is pure Rust with no C linkage, so it does NOT consume an entry on the
# bounded *native* dependency ledger of D13 — that ledger governs C, and its two
# slots are reserved for SQLite and the TLS crypto provider. Pure-Rust crates are
# governed separately by licence filtering and review; see `xtask lint-ledger`.
#
# CRC-32C is hand-written instead (see `record::crc32c`): twelve lines, no
# security role, and not worth a dependency.
sha2 = { version = "0.10", default-features = false }

[lints]
workspace = true
